services:
  wig:
    build: .
    ports:
      - "${PORT:-5504}:5504"
    environment:
      MOCK_BASE_URL: ${MOCK_BASE_URL:-http://localhost:5504}
      APP_SECRET: ${APP_SECRET:-mock-secret}
      VERIFY_TOKEN: ${VERIFY_TOKEN:-mock-verify-token}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - path: .env
        required: false
    # Permite que webhooks apontem para serviços publicados no host de forma estável,
    # sem depender do IP de LAN (ex.: http://host.docker.internal:55500/...).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - csa
    restart: unless-stopped

networks:
  csa:
    external: true
    name: csa_default
